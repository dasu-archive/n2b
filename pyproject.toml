[build-system]
# 패키지 빌드에 setuptools 사용을 명시
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 패키지 이름 (임포트 시 사용: from n2b.module import ...)
name = "n2b" 
version = "0.1.0"
description = "Notion 데이터를 Tistory 블로그로 발행하는 도구"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
maintainers = [
    {name = "Your Name", email = "your@email.com"},
]
# PyPI 웹사이트 등에 표시될 프로젝트 설명
readme = "README.md"
license = {file = "LICENSE"} # LICENSE 파일이 있다면 명시
requires-python = ">=3.8"
keywords = ["notion", "tistory", "automation", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

# 프로젝트 실행에 필수적인 의존성 (pip install 시 설치됨)
dependencies = [
    # 이전 코드에서 사용된 라이브러리 목록을 기반으로 작성
    "python-dotenv",
    "requests",
    "SQLAlchemy",
    "pydantic",
    # 필요하다면 Notion API 클라이언트 라이브러리 추가
    # "notion-client", 
]

[tool.setuptools]
# 실제 소스 코드가 src 디렉토리 아래에 있음을 setuptools에 알려줍니다.
packages = ["n2b"]

[tool.setuptools.package-dir]
# 'n2b' 패키지 내용은 'src' 디렉토리에서 찾으라는 의미입니다.
n2b = "src"


# --- 개발 및 테스트 도구 설정 섹션 ---
# 이 섹션은 실제 패키징에는 포함되지 않지만, 개발 환경 관리에 유용합니다.

[tool.pytest]
# pytest 실행 시 테스트 파일을 찾는 경로와 패턴을 정의합니다.
testpaths = ["tests"]
# 테스트 파일을 test_*.py 또는 *_test.py 패턴으로 찾습니다.
python_files = "test_*.py *_test.py"
# 'test_'로 시작하는 함수/메서드, 'Test'로 시작하는 클래스를 찾습니다.
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"